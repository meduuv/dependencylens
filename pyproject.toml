[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dependencylens"
version = "0.1.0"
description = "Dependency metadata inspection helpers"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}

[tool.pytest.ini_options]
pythonpath = ["src"]
